<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TVS Cars - Admin Panel</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    color: #222;
}

header {
    background: #111827;
    color: white;
    padding: 20px;
    text-align: center;
}

.container {
    width: 95%;
    max-width: 1400px;
    margin: 30px auto;
}

h2 {
    margin-bottom: 20px;
}

.refresh-btn {
    padding: 10px 18px;
    border: none;
    border-radius: 6px;
    background: #111827;
    color: white;
    cursor: pointer;
    margin-bottom: 20px;
}

.refresh-btn:hover {
    opacity: 0.85;
}

.status {
    margin-bottom: 15px;
    font-weight: bold;
}

.table-box {
    background: white;
    padding: 20px;
    border-radius: 10px;
    overflow-x: auto;
    box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

table {
    width: 100%;
    border-collapse: collapse;
}

th,
td {
    padding: 12px;
    border-bottom: 1px solid #ddd;
    text-align: left;
    vertical-align: top;
}

th {
    background: #eeeeee;
}

textarea {
    width: 220px;
    min-height: 80px;
    padding: 8px;
    border: 1px solid #ccc;
    border-radius: 6px;
    resize: vertical;
}

.save-btn {
    margin-top: 7px;
    padding: 8px 12px;
    border: none;
    border-radius: 6px;
    background: #16a34a;
    color: white;
    cursor: pointer;
}

.save-btn:hover {
    opacity: 0.85;
}

.status-badge {
    font-weight: bold;
}

@media (max-width: 700px) {

    th,
    td {
        font-size: 14px;
        padding: 8px;
    }

    textarea {
        width: 180px;
    }
}

</style>
</head>

<body>

<header>

<h1>TVS CARS</h1>

<p>Admin Dashboard</p>

</header>


<div class="container">

<h2>Customer Messages 📩</h2>

<button class="refresh-btn" onclick="loadMessages()">
Refresh Messages
</button>

<p id="status" class="status">
Loading messages...
</p>


<div class="table-box">

<table>

<thead>

<tr>

<th>Name</th>
<th>Email</th>
<th>Message</th>
<th>Date</th>
<th>Status</th>
<th>Reply</th>

</tr>

</thead>

<tbody id="messageTable">

</tbody>

</table>

</div>

</div>


<script>

const GOOGLE_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbwyMizpelcSB8pFF2NkpLVhKvCIt2_XP4byYMCUluDYYfkuL3qGG5LbjsS6HVSEW74d4A/exec";


async function loadMessages() {

    const table =
        document.getElementById("messageTable");

    const status =
        document.getElementById("status");

    status.textContent =
        "Loading messages...";

    try {

        const response =
            await fetch(GOOGLE_SCRIPT_URL);

        if (!response.ok) {
            throw new Error("Network error");
        }

        const messages =
            await response.json();

        table.innerHTML = "";

        if (!messages || messages.length === 0) {

            status.textContent =
                "No messages found.";

            return;
        }


        messages.forEach(function(message) {

            const row =
                document.createElement("tr");


            row.innerHTML = `

                <td>
                    ${escapeHTML(message.name)}
                </td>

                <td>
                    ${escapeHTML(message.email)}
                </td>

                <td>
                    ${escapeHTML(message.message)}
                </td>

                <td>
                    ${escapeHTML(message.date)}
                </td>

                <td class="status-badge">
                    ${escapeHTML(message.status || "Pending")}
                </td>

                <td>

                    <textarea
                        id="reply-${message.row}"
                        placeholder="Write reply..."
                    >${escapeHTML(message.reply || "")}</textarea>

                    <br>

                    <button
                        class="save-btn"
                        onclick="saveReply(${message.row})"
                    >
                        Save Reply
                    </button>

                </td>

            `;

            table.appendChild(row);

        });


        status.textContent =
            messages.length +
            " message(s) found.";

    }

    catch (error) {

        console.error(error);

        status.textContent =
            "Unable to load messages.";

    }

}


async function saveReply(rowNumber) {

    const replyBox =
        document.getElementById(
            "reply-" + rowNumber
        );

    const reply =
        replyBox.value.trim();


    if (!reply) {

        alert("Please write a reply first.");

        return;
    }


    try {

        const formData =
            new URLSearchParams();

        formData.append("action", "reply");
        formData.append("row", rowNumber);
        formData.append("reply", reply);
        formData.append("status", "Replied");


        const response =
            await fetch(
                GOOGLE_SCRIPT_URL,
                {
                    method: "POST",
                    body: formData
                }
            );


        const result =
            await response.json();


        if (result.success) {

            alert("Reply saved successfully!");


            loadMessages();

        } else {

            alert(
                "Error: " +
                (result.error || "Unable to save reply.")
            );

        }

    }

    catch (error) {

        console.error(error);

        alert(
            "Could not save reply."
        );

    }

}


function escapeHTML(value) {

    if (value === null || value === undefined) {
        return "";
    }

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


loadMessages();

</script>

</body>

</html>
